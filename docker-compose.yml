services:
  database:
    image: postgres:13.22-alpine3.22
    container_name: real-estate-agency
    ports:
      - 5440:5432
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin123
      - POSTGRES_DB=db-estate-agency
    volumes:
      - ./postgres:/var/lib/postgresql/data
  pgAdmin:
    image: dpage/pgadmin4:9.7.0
    container_name: pgAdminEstateAgency
    depends_on:
      - database
    ports:
      - 9090:80
    environment:
      - PGADMIN_DEFAULT_EMAIL=test@google.com
      - PGADMIN_DEFAULT_PASSWORD=123456
    volumes:
      - ./pgadmin:/var/lib/pgadmin
      - ./pgadmin:/certs/server.cert
      - ./pgadmin:/certs/server.key
      - ./pgadmin:/pgadmin4/servers.json
    
